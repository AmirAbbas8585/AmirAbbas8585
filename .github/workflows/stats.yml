name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate stats & languages SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_stats.py

      - name: Push SVGs to dedicated stats branch
        run: |
          mv dist/stats.svg /tmp/stats.svg
          mv dist/langs.svg /tmp/langs.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin stats:stats 2>/dev/null; then
            git checkout stats
          else
            git checkout --orphan stats
            git rm -rf --quiet . || true
          fi
          cp /tmp/stats.svg stats.svg
          cp /tmp/langs.svg langs.svg
          git add stats.svg langs.svg
          git diff --cached --quiet || (git commit -m "Update GitHub stats SVGs" && git push origin stats)
